<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VOLT Control</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131b;color:#f3f5fa}body{margin:0;padding:22px 18px 55px;max-width:620px;margin-inline:auto}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 8px}p{line-height:1.5;color:#bdc6d8}.top{display:flex;gap:12px;align-items:center}.bolt{background:#b9ff63;color:#19240f;border-radius:12px;padding:10px;font-weight:900}.sub{font-size:13px;margin:4px 0 22px}.card{background:#1b202c;border:1px solid #30394a;border-radius:16px;padding:18px;margin:12px 0}.label{font-size:12px;color:#aab5ca;margin:12px 0 6px}.status{color:#b9ff63;font-size:14px}.muted{font-size:13px}button{background:#b9ff63;color:#17230f;border:0;border-radius:10px;padding:12px 15px;font:600 14px system-ui;cursor:pointer;margin:6px 6px 0 0}button.secondary{background:#303a4d;color:#fff}button.danger{background:#493038;color:#ffd1d5}button:disabled{opacity:.5}textarea,input{box-sizing:border-box;width:100%;background:#111722;color:#fff;border:1px solid #465266;border-radius:10px;padding:12px;font:14px system-ui}textarea{min-height:85px;resize:vertical}img{display:block;width:min(240px,100%);background:white;border-radius:8px;margin:12px auto}.error{color:#ffb3bd;white-space:pre-wrap}.notice{border-left:3px solid #b9ff63;padding-left:12px}details{border-top:1px solid #394355;padding:10px 0}summary{cursor:pointer;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px system-ui;color:#d5dfec;max-height:300px;overflow:auto}.result{font-size:13px;color:#c7d0df}
</style></head><body>
<div class="top"><div class="bolt">⚡</div><div><h1>VOLT Control</h1><div class="sub">Управление аккаунтами поставщиков</div></div></div>
<p class="notice muted">Подключайте аккаунты и просматривайте полученные сообщения. Разбор прайса предварительный: товары и цены не публикуются.</p><div id="error" class="error" role="alert"></div><button id="reload" class="secondary" type="button">Обновить статус</button><div id="accounts"></div>
<script>
'use strict';
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const root=document.getElementById('accounts'), error=document.getElementById('error');
const timers={};
async function api(path,opts={}){const res=await fetch('/miniapp/api'+path,{...opts,cache:'no-store',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(opts.headers||{})}}); let data=await res.json().catch(()=>({}));if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:'Не удалось выполнить запрос');return data}
function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}
function btn(label,fn,cls){let b=el('button',label,cls);b.type='button';b.onclick=async()=>{b.disabled=true;error.textContent='';try{await fn()}catch(e){error.textContent=e.message}finally{b.disabled=false}};return b}
const labels={not_configured:'Чаты не настроены',connecting:'Подключение к Telegram',monitoring:'Чаты отслеживаются',retrying:'Ошибка подключения, повторяем попытку',disconnected:'Соединение потеряно'};
async function refresh(){const items=await api('/accounts');root.replaceChildren();for(const a of items){const card=el('section',undefined,'card');card.append(el('h2','Аккаунт '+a.slot),el('div',a.connected?'Подключён: '+a.name:'Не подключён','status'));
if(!a.connected){let panel=el('div');card.append(btn('Подключить через QR',async()=>{const r=await api('/accounts/'+a.slot+'/login',{method:'POST'});panel.replaceChildren();panel.append(el('p','На другом устройстве в нужном аккаунте Telegram откройте Настройки → Устройства → Подключить устройство и отсканируйте QR-код.','muted'));let img=el('img');img.src='data:image/png;base64,'+r.qr_image;img.alt='QR-код входа в Telegram';panel.append(img);watch(a.slot,panel)},'secondary'),panel)}else{
card.append(el('p',labels[a.monitor]||a.monitor,'muted'),el('div','Чаты и каналы для отслеживания','label'));let textarea=el('textarea');textarea.placeholder='@channel_name или числовой ID, по одному на строке';textarea.value=a.chats.join('\n');card.append(textarea,btn('Сохранить чаты',async()=>{let chats=textarea.value.split(/\n/).map(x=>x.trim()).filter(Boolean);await api('/accounts/'+a.slot+'/chats',{method:'PUT',body:JSON.stringify({chats})});await refresh()}),btn('Отключить аккаунт',async()=>{if(!confirm('Отключить аккаунт от VOLT Control? Сохранённые сообщения останутся в базе.'))return;await api('/accounts/'+a.slot,{method:'DELETE'});await refresh()},'danger'));let inbox=el('div');card.append(btn('Показать сообщения',async()=>{inbox.replaceChildren();await loadMessages(a.slot,inbox)},'secondary'),inbox)}
root.append(card)}}
async function loadMessages(slot, container, before=null){
  const suffix=before?'?before='+encodeURIComponent(before):'';
  const data=await api('/accounts/'+slot+'/messages'+suffix);
  if(!before && !data.messages.length){container.append(el('p','Сохранённых сообщений пока нет. Проверьте, что чаты сохранены и мониторинг подключился. Файлы пока не обрабатываются.','muted'));return}
  for(const m of data.messages){
    const details=el('details');const title=(m.text||'Сообщение без текста').replace(/\s+/g,' ').slice(0,90);
    details.append(el('summary',title));details.append(el('p','Чат ID: '+m.chat_id+' · сохранено: '+new Date(m.seen_at).toLocaleString('ru-RU'),'muted'));
    details.append(el('pre',m.text||'Текст отсутствует. Файлы пока не обрабатываются.'));
    if(m.truncated)details.append(el('p','Показана часть сообщения. Разбор использует полный сохранённый текст.','muted'));
    if(m.text){let result=el('div',undefined,'result');details.append(btn('Предварительно разобрать',async()=>{
      const p=await api('/accounts/'+slot+'/messages/'+m.id+'/preview');result.replaceChildren();
      result.append(el('p','Кандидатов: '+p.candidates.length+' · проверить: '+p.needs_review.length+' · пропущено: '+p.ignored.length));
      result.append(el('p','Это предварительный разбор, он не создаёт товары и не обновляет цены.','muted'));
      for(const row of p.candidates.slice(0,50))result.append(el('p',row.model+' — '+row.cost+' ₽'));
      for(const row of p.needs_review.slice(0,30))result.append(el('p','Проверить: '+row.raw));
      if(p.candidates.length>50 || p.needs_review.length>30)result.append(el('p','Показана часть результатов.','muted'));
    },'secondary'),result)}container.append(details)
  }
  if(data.next_before){let more=btn('Ещё сообщения',async()=>{more.remove();await loadMessages(slot,container,data.next_before)},'secondary');container.append(more)}
}
function watch(slot,panel){if(timers[slot])clearTimeout(timers[slot]);async function poll(){try{let r=await api('/accounts/'+slot+'/login');if(r.state==='connected'){await refresh();return}if(r.state==='password_required'){panel.replaceChildren(el('p','Введите пароль двухэтапной защиты Telegram.','muted'));let input=el('input');input.type='password';input.autocomplete='off';panel.append(input,btn('Подтвердить',async()=>{let password=input.value;input.value='';await api('/accounts/'+slot+'/password',{method:'POST',body:JSON.stringify({password})});panel.replaceChildren(el('p','Проверяем пароль…','muted'));timers[slot]=setTimeout(poll,1500)}));return}if(['failed','expired','password_invalid','already_connected'].includes(r.state)){panel.replaceChildren(el('p',({failed:'Вход не удался. Попробуйте снова.',expired:'QR-код истёк. Создайте новый.',password_invalid:'Неверный пароль. Начните вход заново.',already_connected:'Этот аккаунт уже подключён.'})[r.state],'error'));return}timers[slot]=setTimeout(poll,1500)}catch(e){error.textContent=e.message}}timers[slot]=setTimeout(poll,1500)}
document.getElementById('reload').onclick=()=>refresh().catch(e=>{error.textContent=e.message});
refresh().catch(e=>{error.textContent=e.message});
</script></body></html>
