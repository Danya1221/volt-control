services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volt
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: change_me
    volumes:
      - volt_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  volt_db:
