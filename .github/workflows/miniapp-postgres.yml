name: Mini App PostgreSQL checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volt_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: volt_control_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U volt_test -d volt_control_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VOLT_TEST_POSTGRES_URL: postgresql+psycopg://volt_test:local_test_only@127.0.0.1:5432/volt_control_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node tests/test_miniapp_ui.cjs

